#
# The availability of inputs (docs/formats/index.md 11): weekly, `otok index-probe` writes
# availability.toml, committed to the default branch.
name: probe
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04  # the tools below; otok-linux-x64 is static and runs on any system
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl jq openssh-client > /dev/null
      - uses: actions/checkout@v5
        with:
          path: index
      - name: Get otok from the index's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/otok" | jq -r '.assets[] | select(.name == "otok-linux-x64") | .url')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/otok" "$asset"
          chmod +x "$RUNNER_TEMP/otok"
      - name: Probe
        env:
          OTOK_CACHE_DIR: ${{ runner.temp }}/otok-cache
        working-directory: index
        run: |
          "$RUNNER_TEMP/otok" index-probe
      - name: Commit
        # pushed as check.yml pushes: with the deploy key of INDEX_PUSH_KEY when there is one, else with the workflow's token
        env:
          PUSH_KEY: ${{ secrets.INDEX_PUSH_KEY }}
          BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: index
        run: |
          git add availability.toml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Probe the inputs of the published versions"
            if [ -n "$PUSH_KEY" ]; then
              host=${GITHUB_SERVER_URL#https://}
              printf '%s\n' "$PUSH_KEY" > "$RUNNER_TEMP/push-key" && chmod 600 "$RUNNER_TEMP/push-key"
              curl -fsSL "$GITHUB_API_URL/meta" | jq -r --arg h "$host" '.ssh_keys[] | "\($h) \(.)"' > "$RUNNER_TEMP/known_hosts"
              export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/push-key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
              git push -q "git@$host:$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
            else
              git push -q
            fi
          fi
