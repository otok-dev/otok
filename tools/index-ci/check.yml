# SPDX-License-Identifier: GPL-3.0-only WITH AdditionRef-otok-output-exception
#
# Index CI (docs/formats/index.md 9): every pull request is checked by `otok index-check`, and one with
# the verdict `auto` is merged by this workflow, with the time of the merge written into its new entries
# (`published`, index.md 3). An index maintainer approves a pull request waiting for one by labelling it
# `approved`; the workflow checks it again and merges it.
#
# The workflow runs on pull_request_target, so this definition comes from the default branch: a pull
# request cannot change what checks it. Nothing of the pull request is executed: it is checked out as
# data, without credentials, and otok comes from the index's release `otok`, never from the pull request.
#
# The default branch should be protected so that only this workflow pushes to it: a pull request merged
# with GitHub's button has no `published` in its entries.
name: check
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    # other labels are not approvals; the workflow's own labels start no workflow
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'approved' }}
    runs-on: ubuntu-24.04
    container: ubuntu:26.04  # the system otok-linux-x64 is built on
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl jq openssh-client > /dev/null
      - name: Drop an earlier approval
        # an approval is of what was approved: a changed pull request is approved again
        if: ${{ github.event.action == 'synchronize' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels/approved"
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: index
      - name: Merge the event's head as data
        # the merge checked is made here, of the default branch as it is now and the head of this event: the merge GitHub
        # computes for a pull request is not renewed reliably when the default branch moves (pushes of this workflow), and
        # a merge of an older default branch could not be pushed. git runs no hook of a fresh clone and no merge driver
        # of the pull request: nothing of it is executed.
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: index
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "refs/pull/$NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "the pull request has changed since this event; its newer check decides" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! git -c user.name=otok -c user.email=otok@invalid merge -q --no-ff --no-edit "$HEAD_SHA"; then
            echo "the pull request conflicts with the default branch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Get otok from the index's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/otok" | jq -r '.assets[] | select(.name == "otok-linux-x64") | .url')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/otok" "$asset"
          chmod +x "$RUNNER_TEMP/otok"
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OTOK_CACHE_DIR: ${{ runner.temp }}/otok-cache
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVER_ID: ${{ github.event.action == 'labeled' && github.event.sender.id || '' }}
        working-directory: index
        run: |
          # the head checked is the head of the event: the one a maintainer approved
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
            echo "the pull request has changed since this event; its newer check decides" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          approval=
          [ -n "$APPROVER_ID" ] && approval="--approved-by $APPROVER_ID"
          "$RUNNER_TEMP/otok" index-check --base HEAD^1 --author-id "$AUTHOR_ID" --repository "$GITHUB_REPOSITORY" --pull-request "$NUMBER" \
            $approval --stamp --summary "$RUNNER_TEMP/summary.json" --comment "$RUNNER_TEMP/comment.md"
      - name: Comment
        # whatever the verdict, refused too: the author learns in the pull request what became of it (index.md 9)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/comment.md" ] || exit 0
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues"
          # the comment of an earlier check is replaced
          id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api/$NUMBER/comments?per_page=100" \
            | jq -r '[.[] | select(.user.type == "Bot" and (.body | contains("<!-- otok-index-check ")))] | last | .id // empty')
          jq -Rs '{body: .}' "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/comment.json"
          if [ -n "$id" ]; then
            curl -fsSL -X PATCH -H "Authorization: Bearer $GH_TOKEN" "$api/comments/$id" -d @"$RUNNER_TEMP/comment.json" > /dev/null
          else
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/$NUMBER/comments" -d @"$RUNNER_TEMP/comment.json" > /dev/null
          fi
      - name: Label
        # the verdict as a label: the maintainers' queue is the open pull requests labelled ready-for-review (index.md 9.2)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/summary.json" ] || exit 0
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels"
          case $(jq -r .verdict "$RUNNER_TEMP/summary.json") in
            maintainer) add=ready-for-review ;;
            refused) add=refused ;;
            *) add= ;;
          esac
          for label in ready-for-review refused; do
            [ "$label" = "$add" ] || curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/$label"
          done
          if [ -n "$add" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" "$api" -d "{\"labels\": [\"$add\"]}" > /dev/null
          fi
      - name: Merge
        # a merge commit of the checked base and head holding the checked files with the time of the merge: pushed to the
        # default branch, it makes GitHub show the pull request merged; refused when the default branch has moved since
        # The push: with the deploy key of the secret INDEX_PUSH_KEY when there is one, the bypass of a ruleset that lets no
        # one else update the default branch (GitHub Actions' own token cannot be given that bypass); else with that token.
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_KEY: ${{ secrets.INDEX_PUSH_KEY }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        working-directory: index
        run: |
          verdict=$(jq -r .verdict "$RUNNER_TEMP/summary.json")
          if [ "$verdict" != auto ]; then
            echo "verdict: $verdict; it waits for an index maintainer's approval" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -u
          tree=$(git write-tree)
          commit=$(printf 'Merge pull request #%s\n\n%s\n' "$NUMBER" "$TITLE" \
            | git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$tree" -p HEAD^1 -p HEAD^2)
          if [ -n "$PUSH_KEY" ]; then
            host=${GITHUB_SERVER_URL#https://}
            printf '%s\n' "$PUSH_KEY" > "$RUNNER_TEMP/push-key" && chmod 600 "$RUNNER_TEMP/push-key"
            curl -fsSL "$GITHUB_API_URL/meta" | jq -r --arg h "$host" '.ssh_keys[] | "\($h) \(.)"' > "$RUNNER_TEMP/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/push-key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            remote="git@$host:$GITHUB_REPOSITORY.git"
          else
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            set -- -c http.extraheader="AUTHORIZATION: basic $auth"
            remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          fi
          if ! git "$@" push -q "$remote" "$commit:refs/heads/$BASE_REF"; then
            echo "the push to the default branch was refused: it moved since the check (run the check again), or the push" \
              "is not allowed (the deploy key of INDEX_PUSH_KEY in the ruleset's bypass list)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
