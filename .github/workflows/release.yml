# Otok (c) Alexander A Pototskiy
# SPDX-License-Identifier: GPL-3.0-only WITH AdditionRef-otok-output-exception
#
# The release of otok (docs/PLAN.md decision 99): a tag v<version> (or v<version>-rc<N>, a prerelease) of
# src/otok/core/build_info.hpp builds the binaries for Windows and Linux with the scripts of tools/release/ and the
# source archive with its submodule, and attaches them with their .sha256 to the GitHub release of the tag. No binary
# for macOS: Homebrew builds otok from the source archive on the user's Mac.
# vcpkg builds the dependencies once: its binary cache (the files provider) is kept in the Actions cache, saved even
# when a build fails, keyed by the manifests and triplets.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # the vcpkg tool and scripts; the ports come from the baseline of vcpkg-configuration.json
  VCPKG_COMMIT: a2f9862da6d88040a8537fb9b8cb24deaa9a196b

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The version and the tag
        run: |
          version=$(sed -n 's/.*std::string_view version = "\([0-9.]*\)".*/\1/p' src/otok/core/build_info.hpp)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no version in build_info.hpp"; exit 1; }
          prerelease=false
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            [[ $tag == "v$version" || $tag =~ ^v${version//./\\.}-rc[0-9]+$ ]] ||
              { echo "::error::the tag $tag is not v$version or v$version-rc<N>"; exit 1; }
            [[ $tag == *-rc* ]] && prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "otok $version, prerelease $prerelease"

  windows:
    needs: version
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\..\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0 }
      - name: vcpkg
        shell: pwsh
        run: |
          git init -q $env:VCPKG_ROOT
          Set-Location $env:VCPKG_ROOT
          git fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git checkout -q FETCH_HEAD
          .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\..\vcpkg-cache" | Out-Null
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\..\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-windows-
      - name: Build
        shell: pwsh
        run: |
          .\tools\release\windows-x64.ps1 -Output "$env:GITHUB_WORKSPACE\build\release"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}\..\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: otok-windows
          path: build/release/otok-*.zip*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    # the system of the index's CI, which runs this binary
    container: ubuntu:26.04
    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,/opt/vcpkg-cache,readwrite
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl zip unzip tar zstd pkg-config perl \
            autoconf automake autoconf-archive libtool python3 linux-libc-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0 }
      - name: vcpkg
        run: |
          git init -q "$VCPKG_ROOT" && cd "$VCPKG_ROOT"
          git fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT" && git checkout -q FETCH_HEAD
          ./bootstrap-vcpkg.sh -disableMetrics
          mkdir -p /opt/vcpkg-cache
      - uses: actions/cache/restore@v4
        with:
          path: /opt/vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-linux-
      - name: Build
        run: bash tools/release/linux-x64.sh "$GITHUB_WORKSPACE/build/release"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /opt/vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: otok-linux
          path: build/release/otok-*.tar.gz*
          if-no-files-found: error

  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Source archive
        run: |
          mkdir -p dist
          sh tools/release/source-archive.sh dist
          cd dist && for f in otok-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: otok-source
          path: dist/otok-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, windows, linux, source]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: The release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          ls -l dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            flags=(--verify-tag --title "otok $VERSION ($tag)" --notes "otok $VERSION, built from $tag ($GITHUB_SHA).")
            [[ $PRERELEASE == true ]] && flags+=(--prerelease)
            gh release create "$tag" "${flags[@]}" dist/*
          fi
