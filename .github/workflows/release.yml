# Otok (c) Alexander A Pototskiy
# SPDX-License-Identifier: GPL-3.0-only WITH AdditionRef-otok-output-exception
#
# The release of otok (docs/PLAN.md decision 99): a tag v<version> (or v<version>-rc<N>, a prerelease) of
# src/otok/core/build_info.hpp builds the binaries for Windows and Linux with the scripts of tools/release/ and the
# source archive with its submodule, and attaches them with their .sha256 to the GitHub release of the tag. No binary
# for macOS: Homebrew builds otok from the source archive on the user's Mac.
# vcpkg builds the dependencies once: its binary cache (the files provider) is kept in the Actions cache, saved even
# when a build fails, keyed by the manifests and triplets.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # the vcpkg tool and scripts; the ports come from the baseline of vcpkg-configuration.json
  VCPKG_COMMIT: a2f9862da6d88040a8537fb9b8cb24deaa9a196b
  # the revision otok shows: the tag (actions/checkout fetches the pushed tag as a lightweight one, which `git describe`
  # does not see), or `git describe` of the checkout when run by hand
  OTOK_REVISION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The version and the tag
        run: |
          version=$(sed -n 's/.*std::string_view version = "\([0-9.]*\)".*/\1/p' src/otok/core/build_info.hpp)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no version in build_info.hpp"; exit 1; }
          prerelease=false
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            [[ $tag == "v$version" || $tag =~ ^v${version//./\\.}-rc[0-9]+$ ]] ||
              { echo "::error::the tag $tag is not v$version or v$version-rc<N>"; exit 1; }
            [[ $tag == *-rc* ]] && prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "otok $version, prerelease $prerelease"

  windows:
    needs: version
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\..\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0 }
      - name: vcpkg
        shell: pwsh
        run: |
          git init -q $env:VCPKG_ROOT
          Set-Location $env:VCPKG_ROOT
          git fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git checkout -q FETCH_HEAD
          .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\..\vcpkg-cache" | Out-Null
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\..\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-windows-
      - name: Build
        shell: pwsh
        run: |
          .\tools\release\windows-x64.ps1 -Output "$env:GITHUB_WORKSPACE\build\release"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}\..\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: otok-windows
          path: build/release/otok-*.zip*
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # one static binary for every distribution (decision 104), made in Alpine for its musl. Through docker run, not
    # `container:`: GitHub's JavaScript actions run in Alpine containers of x64 runners only.
    env:
      ALPINE: alpine:3.24
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0 }
      - name: vcpkg
        run: |
          git init -q ../vcpkg && cd ../vcpkg
          git fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT" && git checkout -q FETCH_HEAD
          mkdir -p ../vcpkg-cache
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-linux-musl-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-linux-musl-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-linux-musl-${{ matrix.arch }}-
      - name: Build
        run: |
          parent=$(cd .. && pwd)
          docker run --rm -v "$parent:/build" -w "/build/$(basename "$GITHUB_WORKSPACE")" \
            -e OTOK_REVISION -e "HOST_IDS=$(id -u):$(id -g)" -e VCPKG_ROOT=/build/vcpkg -e VCPKG_FORCE_SYSTEM_BINARIES=1 \
            -e "VCPKG_BINARY_SOURCES=clear;files,/build/vcpkg-cache,readwrite" \
            "$ALPINE" /bin/sh -c '
              set -e
              trap "chown -R $HOST_IDS /build" EXIT  # the runner saves the cache and uploads the archive
              apk add --no-cache -q build-base cmake ninja-is-really-ninja git curl zip unzip tar zstd pkgconf perl \
                autoconf automake autoconf-archive libtool python3 linux-headers bash ca-certificates
              gcc --version | head -n 1
              git config --global --add safe.directory "*"
              /build/vcpkg/bootstrap-vcpkg.sh -disableMetrics
              bash tools/release/linux.sh "$PWD/build/release"'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-linux-musl-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: otok-linux-${{ matrix.arch }}
          path: build/release/otok-*.tar.gz*
          if-no-files-found: error

  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Source archive
        run: |
          mkdir -p dist
          sh tools/release/source-archive.sh dist
          cd dist && for f in otok-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: otok-source
          path: dist/otok-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, windows, linux, source]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: The release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        # GitHub's API fails now and then (500, 502, a file stored twice): every call is tried again, and every step is
        # idempotent, so that a re-run of this job finishes what a failed one left (a draft, some of the files). The
        # release stays a draft until all its files are on it.
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          ls -l dist
          retry() {
            local i
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "failed ($i of 5): $*" >&2
              (( i < 5 )) && sleep $(( i * 20 ))
            done
            return 1
          }
          # the release of the tag, a draft too (the endpoint of tags does not show drafts); empty: none
          release_id() {
            gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")][0].id // empty"
          }
          flags=(--draft --verify-tag --title "otok $VERSION ($tag)" --notes "otok $VERSION, built from $tag ($GITHUB_SHA).")
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          # a failed creation may have created it all the same: looked for before each try, never made twice
          make_draft() {
            local found
            found=$(release_id) || return 1
            [[ -n $found ]] && return 0
            gh release create "$tag" "${flags[@]}" >/dev/null
          }
          retry make_draft
          id=$(retry release_id)
          [[ -n $id ]] || { echo "no release of $tag after its creation" >&2; exit 1; }
          echo "release $id"
          # a file replaces the one of the same name, if any (a part of a failed upload among them)
          upload() {
            local file=$1 name=${1##*/} old a
            old=$(gh api "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id") || return 1
            for a in $old; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$a" || return 1; done
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$name" >/dev/null
          }
          for file in dist/*; do retry upload "$file"; done
          # every file on it, whole, before it is published
          check() {
            local listed file
            listed=$(gh api "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq '.[] | select(.state == "uploaded") | "\(.name) \(.size)"') || return 1
            for file in dist/*; do
              grep -qxF "${file##*/} $(stat -c %s "$file")" <<<"$listed" || { echo "not on the release: ${file##*/}" >&2; return 1; }
            done
          }
          retry check
          publish=(-X PATCH "repos/$GH_REPO/releases/$id" -F draft=false)
          [[ $PRERELEASE == true ]] || publish+=(-f make_latest=true)
          retry gh api "${publish[@]}" >/dev/null
          echo "published $tag"
